[package]
name = "cute-tui-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
rand = "0.10"
russh = { version = "0.64", default-features = false, features = ["ring"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

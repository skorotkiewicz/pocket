name: Release Pocket

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Install runtime and test tools
        run: sudo apt-get update && sudo apt-get install -y tmux coreutils ffmpeg libglib2.0-bin openssh-client
      - run: bun install --frozen-lockfile
      - name: Check source
        run: |
          bun run check
          bun run test
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Build and test the standalone executable
        run: |
          bun run binary:test
          export POCKET_TUI_BINARY="$PWD/server/target/pocket-tui"
          cargo test --locked --manifest-path server/Cargo.toml --features embedded-tui
          cargo clippy --locked --manifest-path server/Cargo.toml --all-targets --features embedded-tui -- -D warnings
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="pocket-${TAG}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" pocket README.md logo.svg LICENSE
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-${{ matrix.target }}
          path: |
            pocket-*.tar.gz
            pocket-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pocket-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  aur-publish:
    name: Publish pocket-bin to AUR
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Set up builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git openssh pacman-contrib sudo
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Update PKGBUILD and verify sources
        shell: bash
        working-directory: .github/arch
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo 'AUR requires a stable numeric version tag.'; exit 1; }
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          sudo -u builder updpkgsums
          source PKGBUILD
          [[ "${sha256sums_x86_64[0]}" =~ ^[a-f0-9]{64}$ && "${sha256sums_aarch64[0]}" =~ ^[a-f0-9]{64}$ ]] || { echo 'Refusing to publish without release checksums.'; exit 1; }
          sudo -u builder makepkg --verifysource
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: pocket-bin
          pkgbuild: ./.github/arch/PKGBUILD
          assets: |
            ./.github/arch/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
